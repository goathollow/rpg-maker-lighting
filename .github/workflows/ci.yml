name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The screenshot and NW.js tests need RPG Maker MZ's engine and RTP,
      # which can't be shared, so they run locally (see CONTRIBUTING.md).
      - uses: actions/upload-artifact@v4
        with:
          name: GH_Lighting
          path: dist/GH_Lighting.js
